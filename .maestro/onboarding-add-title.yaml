appId: com.rvolkov.watchline.dev
name: Sign up, pick a username, add a title to the watchlist
# Needs the local Supabase stack and an app build pointed at it — see .maestro/README.md.
# TMDB is absent from that build, so search answers from src/media/mock.ts.
---
- runFlow:
    file: subflows/sign-up.yaml
    env:
      USERNAME: maestro

- tapOn:
    text: Rechercher un film ou une série
- inputText: Comète
# A result row is one accessibility element ("C, Comète, Film · 2026, Ajouter"), so the
# "+" cannot be targeted on its own: tap where it sits on the single result's row.
- tapOn:
    point: 92%,19%
# The button's label ends with the chevron icon's glyph, hence the wildcard.
- tapOn: À voir.*
- assertVisible: .*Retirer de mon suivi.*

# The title now shows up in the watchlist tab.
- tapOn: Annuler
- tapOn: Watchlist, tab.*
- assertVisible: .*Comète.*
- takeScreenshot: watchlist-with-title
