# Fast checks only: the whole hook should stay under a second or two.
# Tests run in CI, not here (see .github/workflows/ci.yml).
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,md}"
      run: npx biome check --write --diagnostic-level=error --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: "*.{ts,tsx}"
      run: npm run --silent typecheck
